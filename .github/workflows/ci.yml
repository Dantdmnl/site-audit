name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip install --upgrade pip
      - run: python -m ruff check .
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report
      - run: python -m coverage report --include=audit_core.py --fail-under=85
      - run: python -m coverage report --include=audit_rules.py --fail-under=85
      - run: python -m coverage report --include=audit_reports.py --fail-under=85
      - run: python -m build
      - run: python scripts/smoke_package.py
      - run: python -m pip_audit --local --skip-editable
